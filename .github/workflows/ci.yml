name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun check

      - name: Type check
        run: bun typecheck

      - name: Knip
        run: bun knip

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

  read-authorization:
    name: Read Authorization
    runs-on: ubuntu-latest

    # The unit suite stubs its boundaries, so it cannot catch a predicate that
    # compiles and silently does not apply. This boots a real server against a
    # real database and asserts an unauthenticated caller reaches nothing private.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arbor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arbor
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      GIT_REPOS_PATH: /tmp/arbor-repos
      VERIFY_ENDPOINT: http://localhost:4000/graphql
      # not `development`, which would serve TLS from a mkcert certificate that
      # does not exist here, and not `production`, which protects every route and
      # would reject the anonymous caller these checks depend on
      NODE_ENV: test
      GRAPHILE_ENV: development

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bun run src/scripts/db/migrate.ts

      - name: Boot the API
        run: bun run src/server.ts &

      - name: Wait for the API
        # poll rather than sleep: the schema is built from database introspection
        # at boot, so readiness is not a fixed duration, and a short sleep fails
        # intermittently
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready" >&2
          exit 1

      - name: Verify read authorization
        run: bun run src/scripts/verifyReadAuthorization.ts
